name: Publish crates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates-v0.1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check token and package versions
        shell: bash
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CRATES_IO_TOKEN secret is required'; exit 1; }
          python3 - <<'PY'
          import json
          import subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          versions = {p['name']: p['version'] for p in metadata['packages']}
          expected = {'deckwright', 'dw-cli', 'dw-mcp'}
          assert {name: versions.get(name) for name in expected} == dict.fromkeys(expected, '0.1.1'), versions
          PY
      - name: Publish deckwright
        run: cargo publish --locked -p deckwright
      - name: Publish dw-cli after registry propagation
        shell: bash
        run: |
          for attempt in {1..10}; do
            cargo publish --locked -p dw-cli && exit 0
            if (( attempt == 10 )); then exit 1; fi
            sleep 30
          done
      - name: Publish dw-mcp after registry propagation
        shell: bash
        run: |
          for attempt in {1..10}; do
            cargo publish --locked -p dw-mcp && exit 0
            if (( attempt == 10 )); then exit 1; fi
            sleep 30
          done
