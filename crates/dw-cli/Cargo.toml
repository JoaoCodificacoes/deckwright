[package]
name = "dw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for inspecting and checking PowerPoint presentations"
readme = "README.md"
keywords = ["powerpoint", "pptx", "presentation", "ooxml"]
categories = ["command-line-utilities", "multimedia"]
include = ["/src/**", "/README.md", "/LICENSE"]
[[bin]]
name = "dw"
path = "src/main.rs"
[dependencies]
deckwright = { version = "0.1.0", path = "../deckwright" }
serde_json.workspace = true
[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }
