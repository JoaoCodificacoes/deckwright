[package]
name = "deckwright"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Author and inspect editable PowerPoint presentations"
readme = "README.md"
keywords = ["powerpoint", "pptx", "presentation", "ooxml", "animation"]
categories = ["multimedia", "parser-implementations"]
include = ["/src/**", "/README.md", "/LICENSE", "/benches/**"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
sha2 = "0.10"
thiserror = "2"

[[example]]
name = "thesis"
path = "../../examples/thesis/main.rs"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "query"
harness = false

[[example]]
name = "morph_demo"
path = "../../examples/morph_demo/main.rs"
